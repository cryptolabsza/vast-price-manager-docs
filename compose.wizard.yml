# 0.4.4 appliance recipe. Its image is pinned to the signed release digest in
# RELEASES.md; verify that signature before running it.
services:
  vpm:
    image: ghcr.io/cryptolabsza/vast-price-manager:0.4.4@sha256:51811d3388fc6142212eb6d21746fc884e482975dd218a1710d632c0d1f61dd5
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${HOST_HTTPS_PORT:-8443}:8088"
    volumes:
      - vpm_data:/data
      - vpm_keys:/keys
volumes:
  vpm_data:
  vpm_keys:
