# 0.4.0 appliance recipe. Its image is pinned to the signed release digest in
# RELEASES.md; verify that signature before running it.
services:
  vpm:
    image: ghcr.io/cryptolabsza/vast-price-manager:0.4.0@sha256:20c1e3a4b66ddd723ea1e3c635e0b7dec3f8cc88fe29f4e27e54f1686954eead
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${HOST_HTTPS_PORT:-8443}:8088"
    volumes:
      - vpm_data:/data
      - vpm_keys:/keys
volumes:
  vpm_data:
  vpm_keys:
